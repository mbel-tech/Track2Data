[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "track2data"
# Sourced from track2data/_version.py -- the single source of truth for the
# version, which also feeds ProjectManifest.app_version (stamped into every
# exported dataset's provenance) and the GUI's About box. See
# [tool.hatch.version] below and tests/test_version_consistency.py.
dynamic = ["version"]
description = "Open-source desktop app that turns idtracker.ai output folders into analysis-ready behavioural datasets."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "pydantic>=2.0",
    "click>=8.0",
    "scipy>=1.11",                  # preprocess.pipeline hard-imports identity_switch
                                     # (linear_sum_assignment) and smoothing (savgol_filter)
                                     # unconditionally -- not actually optional at runtime
    "h5py>=3.8",                    # trajectories.h5 is idtracker.ai's own default output
                                     # format (trajectories_formats defaults to
                                     # ['h5','npy','csv']) -- readers/idtrackerai/formats/h5.py.
                                     # The reader degrades gracefully to npy/csv if h5py is
                                     # ever made optional again; see reader.py::_load_payload.
]

[project.optional-dependencies]
video = ["av>=12.0"]            # pyav for frame extraction
zones = ["shapely>=2.0"]        # polygon geometry
export = ["openpyxl>=3.1", "pyarrow>=15.0"]
ui = ["PySide6>=6.6"]           # desktop GUI (LGPL — safe for MIT distribution)
build = ["pyinstaller>=6.0"]    # packaging/track2data.spec (issue #42) -- not needed for
                                 # regular dev/test, only for producing standalone binaries
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "numpy>=1.26",
    "pandas>=2.0",
    "pydantic>=2.0",
    "PySide6>=6.6",
    "shapely>=2.0",              # tests/test_zones/* import track2data.zones.geometry directly
    "pyarrow>=15.0",             # cache/store.py (parquet) and exporters/feather.py call into
                                  # pandas methods that import pyarrow internally, at call time
    "openpyxl>=3.1",             # tests/test_exporters/test_excel.py imports it directly to
                                  # verify workbook content; exporters/excel.py also needs it
                                  # unconditionally to write .xlsx at all
    "pyyaml>=6.0",               # tests/test_issue_templates.py parses the GitHub issue forms
                                  # in .github/ISSUE_TEMPLATE/. Test-only: nothing in the
                                  # shipped package reads YAML.
]

[project.scripts]
track2data     = "track2data.cli:main"
track2data-gui = "app.main:main"

[project.entry-points."track2data.readers"]
idtrackerai    = "track2data.readers.idtrackerai.reader:IDTrackerAiReader"
idtrackerai_v5 = "track2data.readers.idtrackerai_v5:IDTrackerAiV5Reader"
# idtrackerai_v4 deliberately NOT registered as an entry point -- see DECISIONS.md D-012.
# The class is still hardcoded-registered as a built-in in readers/__init__.py (like the
# two above), it's just not advertised to entry-point introspection as a working reader.

[project.entry-points."track2data.metrics"]
# Intentionally empty -- built-in metrics register by direct import in
# metrics/__init__.py::_load_builtins(), not via entry points, so that a
# metric whose optional dependency (scipy, shapely) is missing degrades
# to "not registered" instead of breaking the registry, and so built-ins
# work from a source checkout with no installed distribution metadata.
# Third-party plug-ins DO use this group -- see TECHNICAL_SPEC.md §12.1.

[project.entry-points."track2data.exporters"]
# Intentionally empty for the same reason -- see the note above and
# exporters/__init__.py::_load_builtins().

[tool.hatch.version]
path = "track2data/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["track2data", "app", "ui"]

# ── Ruff ───────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "SIM", "RUF"]
ignore = [
    "ANN401",  # Any allowed in internal helpers
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S", "RUF012"]  # RUF012: ClassVar annotation not required in test ABC subclasses
"track2data/core/errors.py" = ["N801", "N818"]  # ImportError_ uses trailing _ to avoid shadowing built-in
"track2data/core/progress.py" = ["N818"]  # OperationCancelled is a control-flow signal, not an "error"
"extract_bboxes.py" = ["ANN"]  # utility script; public-API type-annotation policy does not apply
".claude/skills/**" = ["ANN"]  # agent tooling (GUI driver), not product surface -- same
                                # rationale as extract_bboxes.py above. Only ANN is relaxed,
                                # so real errors (F, E, B, SIM, ...) still gate normally.
"app/**" = ["ANN", "N815"]   # N815: Qt signal names are camelCase by convention
"ui/**" = ["ANN", "N815", "N802"]    # N802: Qt event-handler overrides (showEvent, etc.) are camelCase by convention

# ── Pytest ─────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "r_parity: marks tests that compare output against R pipeline reference",
    "r_parity_local: marks tests requiring embargoed local R-pipeline fixtures (skip in CI)",
    "slow: marks tests that are expected to be slow",
    "corpus_local: marks tests requiring the embargoed 70-session real idtracker.ai corpus (skip in CI; skips automatically when the corpus directory is absent)",
    "network: marks tests that call a third-party API (Crossref DOI resolution); excluded in CI, since an outage there is not a defect here. Run with: pytest -m network",
]

[tool.coverage.run]
source = ["track2data"]
omit = ["track2data/cli.py"]

[tool.coverage.report]
fail_under = 80
